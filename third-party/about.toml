# What cargo-about accepts when it lists the crates a release archive carries. The release runs
# it through tools/release/notices.mjs, once per target and features, from Cargo.lock, and CI
# does the same on every pull request so that a crate the list cannot take is refused there
# rather than at a tag.
#
# In priority order: a crate offering a choice is listed under the first licence here that
# satisfies its expression, which for the usual "MIT OR Apache-2.0" is Apache-2.0. A crate whose
# expression nothing here satisfies fails the build of the notices. So does one whose licence
# names a copyright holder when the text found for it is SPDX's template rather than the
# crate's own (notices.mjs checks that; cargo-about substitutes the template without saying
# so). Adding a licence here is a decision about what the binary may contain, and belongs in
# the pull request that brings the crate in.
accepted = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # File-level copyleft: section 3.2 asks that whoever receives an executable is told where
    # the source is, which the notices do for every crate.
    "MPL-2.0",
    # webpki-root-certs: the Mozilla root store, as data.
    "CDLA-Permissive-2.0",
    "Apache-2.0 WITH LLVM-exception",
]

# What `cargo tree -e normal,build` lists for an archive, which is what the release checks the
# notices against. Dev-dependencies reach no archive.
ignore-build-dependencies = false
ignore-dev-dependencies = true

# The workspace's own crates are this repository's code, under the LICENSE beside the binary.
private = { ignore = true }

# ClearlyDefined is a web service whose answers can change under a fixed Cargo.lock. The texts
# come from the files each crate was published with, or, where it was published without them,
# from its repository at the commit it was published from.
no-clearly-defined = true

# Each clarification names the file its text is taken from and that file's SHA-256. A file that
# no longer matches is ignored with a warning, which notices.mjs turns into a failure, so a
# licence that changes under a version bump is read again by a person rather than carried over.

# Offered under either licence; the crate ships only the BSD text, so that is the one taken.
[brotli-decompressor.clarify]
license = "BSD-3-Clause"
[[brotli-decompressor.clarify.files]]
path = "LICENSE"
checksum = "c0c56f26d9c051cac4d200c34c84e7ae9aaa853e01a982a1df08b09931e518ae"

