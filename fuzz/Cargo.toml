[package]
name = "steamgauge-fuzz"
version = "0.0.0"
edition = "2024"
description = "Fuzz targets for the SteamGauge code that reads text a stranger wrote."
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

# ort is named only for the features it adds to the core crate's ort, which no code here calls;
# arbitrary and libloading only to pin them.
[package.metadata.cargo-machete]
ignored = ["ort", "arbitrary", "libloading"]

# A workspace of its own. The product's workspace never builds, tests, lints or ships this
# crate, and libFuzzer needs a sanitiser-capable compiler the product's gates do not have. One
# workspace would also unify features: the load-dynamic above would reach the product's ort.
[workspace]
members = ["."]

[[bin]]
bench = false
doc = false
name = "splitter"
path = "fuzz_targets/splitter.rs"
test = false

[[bin]]
bench = false
doc = false
name = "stored_span"
path = "fuzz_targets/stored_span.rs"
test = false

[[bin]]
bench = false
doc = false
name = "reader_window"
path = "fuzz_targets/reader_window.rs"
test = false

[[bin]]
bench = false
doc = false
name = "terms"
path = "fuzz_targets/terms.rs"
test = false

# The harness keeps no lock file of its own: it builds on a copy of the product's, so it fuzzes
# the versions the product ships. Every crate that copy lacks is one only the harness needs, and
# each is pinned exactly here, which CI's deny job holds it to.
[dependencies]
arbitrary = "=1.5.0"
libfuzzer-sys = "=0.4.13"
libloading = "=0.9.0"
# Loaded at run time rather than linked. The prebuilt ONNX Runtime the product links wants a
# newer glibc and libstdc++ than OSS-Fuzz's Ubuntu 20.04 image has, and no target here runs a
# model, so nothing is ever loaded.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic"] }
# Without the app's own update, which reads no stranger's text, and without the prebuilt ONNX
# Runtime, which only a model run needs.
steamgauge-core = { path = "../crates/steamgauge-core", default-features = false }

[lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
cargo = { level = "warn", priority = -1 }
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
filetype_is_file = "warn"
fn_to_numeric_cast_any = "warn"
format_push_string = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
infinite_loop = "warn"
iter_over_hash_type = "warn"
let_underscore_must_use = "allow"
literal_string_with_formatting_args = "allow"
lossy_float_literal = "warn"
map_err_ignore = "warn"
map_with_unused_argument_over_ranges = "warn"
mem_forget = "warn"
missing_assert_message = "warn"
mixed_read_write_in_expression = "warn"
multiple_crate_versions = "allow"
needless_raw_strings = "warn"
non_zero_suggestions = "warn"
nursery = { level = "warn", priority = -1 }
option_if_let_else = "allow"
panic_in_result_fn = "warn"
pathbuf_init_then_push = "warn"
pedantic = { level = "warn", priority = -1 }
precedence_bits = "warn"
pub_without_shorthand = "warn"
rc_buffer = "warn"
redundant_pub_crate = "allow"
redundant_test_prefix = "warn"
redundant_type_annotations = "warn"
ref_patterns = "warn"
renamed_function_params = "warn"
rest_pat_in_fully_bound_structs = "warn"
return_and_then = "warn"
same_name_method = "warn"
self_named_module_files = "warn"
semicolon_outside_block = "warn"
significant_drop_tightening = "allow"
str_to_string = "warn"
string_add = "warn"
string_lit_chars_any = "warn"
suboptimal_flops = "allow"
todo = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_self_imports = "warn"
unneeded_field_pattern = "warn"
unseparated_literal_suffix = "warn"
unused_result_ok = "warn"
unused_trait_names = "warn"
unwrap_in_result = "warn"
verbose_file_reads = "warn"
zero_sized_map_values = "warn"

# The product workspace's lint tables, copied because this workspace cannot inherit them. Keep
# the two in step.
[lints.rust]
ambiguous_negative_literals = "warn"
deprecated_in_future = "warn"
deref_into_dyn_supertrait = "warn"
explicit_outlives_requirements = "warn"
if_let_rescope = "warn"
impl_trait_overcaptures = "warn"
linker_messages = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_debug_implementations = "warn"
missing_unsafe_on_extern = "warn"
non_ascii_idents = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
single_use_lifetimes = "warn"
tail_expr_drop_order = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[lints.rustdoc]
bare_urls = "warn"
broken_intra_doc_links = "warn"
invalid_codeblock_attributes = "warn"
invalid_html_tags = "warn"
invalid_rust_codeblocks = "warn"
private_intra_doc_links = "warn"
redundant_explicit_links = "warn"
unescaped_backticks = "warn"

# The product workspace's patch, for the same reason as there.
[patch.crates-io]
include-flate = { git = "https://github.com/SOF3/include-flate", rev = "ecb6b7a4972e61e8e5cf3f1caa627964c531a858" }
include-flate-codegen = { git = "https://github.com/SOF3/include-flate", rev = "ecb6b7a4972e61e8e5cf3f1caa627964c531a858" }
include-flate-compress = { git = "https://github.com/SOF3/include-flate", rev = "ecb6b7a4972e61e8e5cf3f1caa627964c531a858" }
