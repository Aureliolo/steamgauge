[package]
name = "steamgauge-fuzz"
description = "Fuzz targets for the SteamGauge code that reads text a stranger wrote."
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

# ort is named only for the features it adds to the core crate's ort, which no code here calls;
# arbitrary and libloading only to pin them.
[package.metadata.cargo-machete]
ignored = ["ort", "arbitrary", "libloading"]

# The harness keeps no lock file of its own: it builds on a copy of the product's, so it fuzzes
# the versions the product ships. Every crate that copy lacks is one only the harness needs, and
# each is pinned exactly here, which CI's deny job holds it to.
[dependencies]
libfuzzer-sys = "=0.4.13"
arbitrary = "=1.4.2"
# Without the app's own update, which reads no stranger's text.
steamgauge-core = { path = "../crates/steamgauge-core", default-features = false }
# Loaded at run time rather than linked. The prebuilt ONNX Runtime the product links wants a
# newer glibc and libstdc++ than OSS-Fuzz's Ubuntu 20.04 image has, and no target here runs a
# model, so nothing is ever loaded.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic"] }
libloading = "=0.9.0"

# A workspace of its own. The product's workspace never builds, tests, lints or ships this
# crate, and libFuzzer needs a sanitiser-capable compiler the product's gates do not have. One
# workspace would also unify features: the load-dynamic above would reach the product's ort.
[workspace]
members = ["."]

[[bin]]
name = "splitter"
path = "fuzz_targets/splitter.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stored_span"
path = "fuzz_targets/stored_span.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reader_window"
path = "fuzz_targets/reader_window.rs"
test = false
doc = false
bench = false

[[bin]]
name = "terms"
path = "fuzz_targets/terms.rs"
test = false
doc = false
bench = false
