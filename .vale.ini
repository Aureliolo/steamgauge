# What a person reads of SteamGauge is held to plain words: the README and SECURITY, the report
# pages, and every page of the window as its check renders them. Reviews quoted from players are
# their words, not the product's, and are left out by the classes that show them: `claim` in the
# report and `said` in the window.
StylesPath = .vale/styles
MinAlertLevel = error
IgnoredClasses = claim, said

[*.{md,html}]
BasedOnStyles = SteamGauge
