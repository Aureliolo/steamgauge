[workspace]
resolver = "3"
members = ["crates/steamgauge-core", "crates/steamgauge-app", "crates/steamgauge-site"]

[workspace.package]
version = "0.2.15"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"
repository = "https://github.com/Aureliolo/steamgauge"
homepage = "https://aureliolo.github.io/steamgauge/"
authors = ["Aurelio Amoroso <19254254+Aureliolo@users.noreply.github.com>"]
publish = false

[workspace.dependencies]
steamgauge-core = { path = "crates/steamgauge-core" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Cargo's sixteen codegen units: one built twice as slowly and ran no faster, since reading runs
# inside ONNX Runtime, which this setting never touches.
[profile.release]
lto = "thin"
strip = true
