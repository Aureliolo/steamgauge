name: dependency review

# Refuses a pull request that brings in a dependency with a known advisory of any severity, or
# under a licence outside the permissive list below, from any of the manifests GitHub's dependency
# graph reads: the Cargo locks, the Python lock and the workflows' actions. Advisories come from
# GitHub's database, beside the RustSec one cargo-deny reads in ci.yml; the licence list is the
# maintainer's, and deny.toml holds the Rust graph to the narrower one the release notices cover.
# DirectML.dll is vendored, outside the graph: its terms are read in third-party/ and ship in the
# notices.
on:
  # Every pull request, whatever it targets, so that one stacked on another is checked too.
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: dependency-review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # Reads the dependency graph of both sides of the pull request.

    steps:
      - name: Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          allow-licenses: >-
            MIT, Apache-2.0, Apache-2.0 WITH LLVM-exception, BSD-2-Clause, BSD-3-Clause, ISC, Zlib,
            0BSD, Unlicense, CC0-1.0, BSL-1.0, Python-2.0, MPL-2.0, Unicode-3.0, CDLA-Permissive-2.0
          # They declare "Apache-2.0/MIT" and "BSD-3-Clause/MIT", which GitHub cannot parse; each
          # means either licence, and cargo deny reads them so.
          allow-dependencies-licenses: >-
            pkg:cargo/dbus, pkg:cargo/libdbus-sys, pkg:cargo/brotli-decompressor
