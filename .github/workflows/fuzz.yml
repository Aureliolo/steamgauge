name: fuzz

# The splitter, the reader's window and the term cut read text written by strangers, and a panic
# in any of them stops the reading of a whole library. ClusterFuzzLite builds the targets under
# fuzz/ with AddressSanitizer in OSS-Fuzz's image (.clusterfuzzlite/) and runs them: briefly on
# every pull request, for an hour every Monday on main, with the corpus that run grows pruned
# after it. The corpus is kept as an artifact of these runs, which is where the pull request run
# starts from. A crash fails the job, attaches the input that caused it to the run, and goes to
# code scanning beside the Scorecard results.
#
# No paths filter, for the reason workflows.yml gives: a check that never reports holds a pull
# request forever once it is required.
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "43 2 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request:
    name: fuzz
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read # Finds the corpus the weekly run left as an artifact.
      contents: read # Clones the repository at the pull request.
      security-events: write # Uploads what a crash was to code scanning.
    steps:
      - name: Build the fuzz targets
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          sanitizer: address
          github-token: ${{ github.token }}

      - name: Fuzz for ten minutes across the targets
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ github.token }}
          fuzz-seconds: 600
          mode: code-change
          sanitizer: address
          output-sarif: true

      # A pull request from a fork is handed a token that cannot write to code scanning; its
      # crash still fails the job and is still attached to the run.
      - name: Report to code scanning
        if: always() && steps.build.outcome == 'success' && !github.event.pull_request.head.repo.fork
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: cifuzz-sarif/results.sarif
          checkout_path: cifuzz-sarif
          category: clusterfuzzlite

  batch:
    name: batch
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read # Finds the corpus the last run left as an artifact.
      contents: read # Clones the repository at main.
      security-events: write # Uploads what a crash was to code scanning.
    steps:
      - name: Build the fuzz targets
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          sanitizer: address
          github-token: ${{ github.token }}

      - name: Fuzz for an hour across the targets
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ github.token }}
          fuzz-seconds: 3600
          mode: batch
          sanitizer: address
          output-sarif: true

      - name: Report to code scanning
        if: always() && steps.build.outcome == 'success'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: cifuzz-sarif/results.sarif
          checkout_path: cifuzz-sarif
          category: clusterfuzzlite

  # What the hour added, cut to the inputs that each reach something no other input does, so
  # the corpus a pull request starts from stays small enough to replay in its ten minutes.
  prune:
    name: prune
    needs: batch
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read # Downloads the corpus the batch run left as an artifact.
      contents: read # Clones the repository at main.
    steps:
      - name: Build the fuzz targets
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          sanitizer: address
          github-token: ${{ github.token }}

      - name: Prune the corpus
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ github.token }}
          fuzz-seconds: 600
          mode: prune
          sanitizer: address
