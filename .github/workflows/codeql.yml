name: codeql

# CodeQL over every language the repository is written in: the Rust of both crates, the Python
# that trains the reader, the JavaScript of the report and the app's window, and the workflows
# themselves. The security-and-quality suite rather than the default one, and as a check on every
# pull request rather than a scan nobody waits for. Nothing needs building: each language is read
# from source.
on:
  push:
    branches:
      - main
  # Every pull request, whatever it targets, so that one stacked on another is checked too.
  pull_request:
  # A query pack that learns a new pattern finds it in code that has not changed since.
  schedule:
    - cron: "29 3 * * 3"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A pull request that holds no code runs each job with its steps skipped, so it reports under the
# name the ruleset requires; see ci.yml and .github/actions/scope.
jobs:
  scope:
    name: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # Fetches the two commits a pull request compares.
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      # The pull request's merge commit and the base under it, which is all the classifier reads.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: scope
        uses: $/.github/actions/scope

  analyse:
    name: codeql (${{ matrix.language }})
    needs: scope
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        language: [actions, rust, python, javascript-typescript]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read # Reads the source it analyses.
      security-events: write # Uploads the findings to code scanning.

    steps:
      - name: Checkout
        if: needs.scope.outputs.code != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialise
        if: needs.scope.outputs.code != 'false'
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality

      - name: Analyse
        if: needs.scope.outputs.code != 'false'
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
