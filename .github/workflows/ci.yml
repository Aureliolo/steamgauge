name: ci

on:
  push:
    branches: [main]
  # Every pull request, whatever it targets, so that one stacked on another is checked too.
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# The runners are the images release-build.yml builds the release on, so what is tested here is
# what ships. Matrix jobs are named by platform rather than by image: the name is what the branch
# ruleset requires, and an image raise must not rename a required check out from under it.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # Reads the source it lints.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The desktop shell is Tauri, which links against the system webview. On Linux that is
      # WebKitGTK, and without it the workspace does not build at all: the failure is
      # `glib-sys` failing its build script, which names nothing about Tauri.
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: ./.github/actions/onnx-runtime
      - run: cargo fmt --all -- --check
      # Deliberately not --all-features: the cuda and coreml backends need vendor toolchains
      # the runners do not have, and the default set is what actually ships.
      # --locked everywhere here, as the release build has it: a pull request that leaves
      # Cargo.lock behind its manifests fails now, not at a tag that cannot be taken back.
      - run: cargo clippy --locked --all-targets -- -D warnings
      # The training scripts are Python; `training/ruff.toml` holds their width.
      - run: pipx run ruff==0.15.2 check training && pipx run ruff==0.15.2 format --check training
      # The release tools pick a version that can never be reused and write what each release
      # says it changed, and otherwise run only when a release is cut.
      - run: node --test tools/release/release.test.mjs
      # The Windows setup program's script is Tauri's at the pinned bundler plus one change; a
      # tauri-cli bump that moves Tauri's script fails here until the copy is taken again.
      - run: bash tools/release/installer-template-check.sh

  # The THIRD-PARTY-NOTICES.txt each release archive carries, written for all three the way the
  # release writes them, so that a crate under a licence third-party/about.toml does not accept,
  # or one with no licence text of its own, is refused on its pull request rather than at a tag
  # that cannot be taken back. Nothing is compiled.
  notices:
    name: notices
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # Reads Cargo.lock, third-party/ and the notices script.
    env:
      # release-build.yml's targets, each with its GPU feature after the colon.
      ARCHIVES: >-
        x86_64-unknown-linux-gnu:
        x86_64-pc-windows-msvc:directml
        aarch64-apple-darwin:coreml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # As release-build.yml installs it, which says why the digest is the checksum file's.
      - name: Install cargo-about
        env:
          # renovate: datasource=github-release-attachments depName=EmbarkStudios/cargo-about versioning=regex:^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
          CARGO_ABOUT_TAG: 0.8.4
          CARGO_ABOUT_SHA256: d579efd42d93e71d731facd7ddb38a6354e8e0eb9cfba7f9877afdb6e8df92cb
        run: |
          set -euo pipefail
          archive="cargo-about-${CARGO_ABOUT_TAG}-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/EmbarkStudios/cargo-about/releases/download/${CARGO_ABOUT_TAG}/${archive}"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 6 --retry-all-errors -o "${RUNNER_TEMP}/${archive}.sha256" "${url}.sha256"
          echo "${CARGO_ABOUT_SHA256}  ${RUNNER_TEMP}/${archive}.sha256" | sha256sum --check --strict
          digest="$(cat "${RUNNER_TEMP}/${archive}.sha256")"
          if [[ ! "${digest}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "${archive}.sha256 does not hold a SHA-256." >&2
            exit 1
          fi
          curl -fsSL --proto '=https' --tlsv1.2 --retry 6 --retry-all-errors -o "${RUNNER_TEMP}/${archive}" "${url}"
          echo "${digest}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" --strip-components=1 "${archive%.tar.gz}/cargo-about"
          "${RUNNER_TEMP}/cargo-about" --version
      - name: Write the notices
        run: |
          set -euo pipefail
          for archive in ${ARCHIVES}; do
            target="${archive%%:*}"
            node tools/release/notices.mjs write "${RUNNER_TEMP}/cargo-about" "${target}" "${archive#*:}" \
              "${RUNNER_TEMP}/notices/${target}/THIRD-PARTY-NOTICES.txt"
          done

  # What ships on Windows and macOS is built with a GPU backend, and the code behind each is
  # behind its feature, so the default lint above never compiles it. Without this the first
  # compile of the provider code a release actually runs is the release build.
  backends:
    name: backends (${{ matrix.platform }}, ${{ matrix.feature }})
    strategy:
      fail-fast: false
      matrix:
        # Renovate reads a runner out of `runs-on:` but not out of a matrix, so each of these
        # carries its own line for it.
        include:
          - platform: windows
            # renovate: datasource=github-runners depName=windows
            runner: windows-2025
            feature: directml
          - platform: macos
            # renovate: datasource=github-runners depName=macos
            runner: macos-26
            feature: coreml
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read # Reads the source it lints.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: ./.github/actions/onnx-runtime
        with:
          features: ${{ matrix.feature }}
      - shell: bash
        env:
          FEATURE: ${{ matrix.feature }}
        run: cargo clippy --locked --workspace --all-targets --features "steamgauge-core/${FEATURE}" -- -D warnings

  test:
    name: test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            # renovate: datasource=github-runners depName=ubuntu
            runner: ubuntu-24.04
          - platform: windows
            # renovate: datasource=github-runners depName=windows
            runner: windows-2025
          - platform: macos
            # renovate: datasource=github-runners depName=macos
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read # Reads the source it tests.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: ./.github/actions/onnx-runtime
      - run: cargo test --locked --workspace

  # The training scripts decide every figure the reader is quoted with, and their tests need
  # no card and no labels. The lock is resolved for Windows (onnxruntime-directml has no other
  # wheel), and its torch is the CUDA build: the same version from the CPU index runs the same
  # code without a multi-gigabyte download of libraries a runner cannot use.
  python:
    name: python
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read # Reads the training scripts and their lock.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          activate-environment: true
      - shell: bash
        run: |
          torch=$(grep '^torch==' training/requirements.lock | sed 's/+.*//')
          grep -v -e '^torch==' -e '^--extra-index-url' training/requirements.lock > "$RUNNER_TEMP/requirements.txt"
          uv pip install --no-config --index-strategy unsafe-best-match \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -r "$RUNNER_TEMP/requirements.txt" "$torch+cpu"
      - run: python -m pytest -q
        working-directory: training

  # The report's folding, filtering, sorting and deep links only exist once a browser has run
  # them, and so does its rendering: a stylesheet rule can flatten a chart or turn a printed
  # page into blocks of ink while the markup stays exactly right. Both are the one part of
  # this tool no Rust test can reach. The runner's own Chrome drives a page rendered from a
  # fixture, on screen and again under print media, needing no corpus and no model.
  report:
    name: report
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # Reads the source it builds the pages from.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: ./.github/actions/onnx-runtime
      # axe-core, which checks every page and state of the report and the window against WCAG
      # 2.2 at levels A and AA, at the version and hash the lock file pins, with no install
      # scripts run.
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tools
      # No system webview needed here: the example lives in the core crate, which is the
      # half of the workspace that knows nothing about a window.
      - run: cargo run --locked -p steamgauge-core --example sample-report -- report.html
      - run: node tools/report-check/check.mjs report.html
      # A report of one game has no cross-game matrix and no contents to come back to, so it
      # is a different page and gets driven too.
      - run: cargo run --locked -p steamgauge-core --example sample-report -- one.html --one-game
      - run: node tools/report-check/check.mjs one.html
      # A census of a genre is dozens of games, and that is where the cross-game table stops
      # fitting on a screen at all. Four games never exercise it.
      - run: cargo run --locked -p steamgauge-core --example sample-report -- many.html --games 36
      - run: node tools/report-check/check.mjs many.html
      # The adjudication page is the only place a person's judgement enters the project, and
      # every figure that can be called accuracy rather than agreement will rest on it. A
      # shortcut that does nothing or an answer that does not survive a reload would be found
      # after somebody had read a thousand claims, which is exactly too late.
      - run: cargo run --locked -p steamgauge-core --example sample-gold -- gold.html
      - run: node tools/gold-check/check.mjs gold.html
      # And again as it is actually run. A POST that silently does nothing looks exactly like
      # one that worked, so the promise that every answer is on disk before the next question
      # is drawn is the one worth a browser to check.
      - run: node tools/gold-check/served.mjs gold.html
      # The other kind of question the page asks: whether a reader's other subject would also
      # do, answered yes or no and kept apart from the gold answer it sits beside.
      - run: cargo run --locked -p steamgauge-core --example sample-gold -- accept.html --acceptable
      - run: node tools/gold-check/acceptable.mjs accept.html
      # The desktop app's window, every page of it, against a stand-in for the core: the work
      # board, the library's grouping and selection, the comparison and the settings exist only
      # once a browser has run them.
      - run: node tools/app-check/check.mjs --pages pages
      # Every word a person reads, as they read it: the README and SECURITY, the report pages
      # above and each page of the window as its check rendered it, held to the plain style in
      # .vale/. Players' own words, quoted in reviews, are left out.
      - name: Install Vale
        env:
          # renovate: datasource=github-release-attachments depName=errata-ai/vale versioning=regex:^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
          VALE_TAG: v3.24.0
          VALE_SHA256: 867534ddb678abca7f214bc4706ead0922bd5252ffe8035fc227013f66c8b214
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/vale.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 6 --retry-all-errors -o "${archive}" \
            "https://github.com/errata-ai/vale/releases/download/${VALE_TAG}/vale_${VALE_TAG#v}_Linux_64-bit.tar.gz"
          echo "${VALE_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/vale"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/vale" vale
          echo "${RUNNER_TEMP}/vale" >> "${GITHUB_PATH}"
      - name: Check the words people read
        run: vale README.md SECURITY.md training/README.md reference/README.md report.html one.html many.html pages

  # Advisories, yanked crates, licences and sources for both graphs: the product's, and the fuzz
  # harness's, which is a workspace of its own. The harness keeps no lock file; it builds on the
  # product's, as .clusterfuzzlite/build.sh does, so it fuzzes the versions the product ships and
  # cannot fall behind them. Cargo adds to that copy only what the harness alone needs, which
  # fuzz/Cargo.toml pins exactly.
  deny:
    name: deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # Reads the manifests, the lock files and the ignore lists.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The archive's digest is read from the checksum file the release publishes beside it,
      # which is what is pinned here, as for cargo-about in the notices job: that file holds the
      # digest with no file name, and pinned to the archive Renovate would write the checksum
      # file's digest in its place.
      - name: Install cargo-deny
        env:
          # renovate: datasource=github-release-attachments depName=EmbarkStudios/cargo-deny versioning=regex:^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
          CARGO_DENY_TAG: 0.20.2
          CARGO_DENY_SHA256: 8ac46937040e08ea06fe0f87340c495b79c913cc86a36c065d7b9a8b352c14f3
        run: |
          set -euo pipefail
          name="cargo-deny-${CARGO_DENY_TAG}-x86_64-unknown-linux-musl"
          url="https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_TAG}/${name}.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 6 --retry-all-errors -o "${RUNNER_TEMP}/${name}.tar.gz.sha256" "${url}.sha256"
          echo "${CARGO_DENY_SHA256}  ${RUNNER_TEMP}/${name}.tar.gz.sha256" | sha256sum --check --strict
          digest="$(cat "${RUNNER_TEMP}/${name}.tar.gz.sha256")"
          if [[ ! "${digest}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "${name}.tar.gz.sha256 does not hold a SHA-256." >&2
            exit 1
          fi
          curl -fsSL --proto '=https' --tlsv1.2 --retry 6 --retry-all-errors -o "${RUNNER_TEMP}/${name}.tar.gz" "${url}"
          echo "${digest}  ${RUNNER_TEMP}/${name}.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${name}.tar.gz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/${name}" >> "${GITHUB_PATH}"
      - name: Check the product's graph
        run: cargo deny --workspace --locked check
      - name: Check the fuzz harness's graph
        run: |
          cp Cargo.lock fuzz/Cargo.lock
          cargo deny --manifest-path fuzz/Cargo.toml --workspace check
      - name: Hold the harness's own crates to their pins
        shell: python
        run: |
          import sys
          import tomllib
          from pathlib import Path


          def load(path):
              return tomllib.loads(Path(path).read_text(encoding="utf-8"))


          product = {(entry["name"], entry["version"]) for entry in load("Cargo.lock")["package"]}
          pins = {
              name: spec if isinstance(spec, str) else spec.get("version", "")
              for name, spec in load("fuzz/Cargo.toml")["dependencies"].items()
          }
          wrong = [
              f"The fuzz harness takes {entry['name']} {entry['version']}, which neither the product's"
              " lock nor an exact pin in fuzz/Cargo.toml holds."
              for entry in load("fuzz/Cargo.lock")["package"]
              if "source" in entry
              and (entry["name"], entry["version"]) not in product
              and pins.get(entry["name"]) != f"={entry['version']}"
          ]
          for message in wrong:
              print(f"::error::{message}")
          sys.exit(1 if wrong else 0)
      # cargo-deny keeps no expiry for an ignored advisory, so each one it ignores is held to
      # the entry osv-scanner.toml keeps for it, whose ignoreUntil is the one date that counts.
      - name: Hold the ignored advisories to osv-scanner.toml
        shell: python
        run: |
          import datetime
          import sys
          import tomllib
          from pathlib import Path


          def load(path):
              return tomllib.loads(Path(path).read_text(encoding="utf-8"))


          today = datetime.datetime.now(datetime.UTC).date()
          kept = {entry["id"]: entry for entry in load("osv-scanner.toml")["IgnoredVulns"]}
          wrong = []
          ignored = set()
          for path in ("deny.toml", "fuzz/deny.toml"):
              for entry in load(path)["advisories"].get("ignore", []):
                  advisory = entry["id"] if isinstance(entry, dict) else entry
                  ignored.add(advisory)
                  if advisory not in kept:
                      wrong.append(f"{path} ignores {advisory}, which osv-scanner.toml does not list.")
                  elif kept[advisory]["ignoreUntil"] <= today:
                      until = kept[advisory]["ignoreUntil"]
                      wrong.append(f"{path} ignores {advisory}, whose ignoreUntil {until} has passed.")
          for advisory in sorted(kept):
              if advisory.startswith("RUSTSEC-") and advisory not in ignored:
                  wrong.append(f"osv-scanner.toml ignores {advisory}, which no deny.toml does.")
          for message in wrong:
              print(f"::error::{message}")
          sys.exit(1 if wrong else 0)

  # A dependency no code uses still compiles, still ships its licence and still carries its
  # advisories.
  machete:
    name: machete
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # Reads the manifests and the source it checks them against.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # As cargo-deny above, and for the same reason the checksum file's digest is the one pinned.
      - name: Install cargo-machete
        env:
          # renovate: datasource=github-release-attachments depName=bnjbvr/cargo-machete versioning=regex:^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
          CARGO_MACHETE_TAG: v0.9.2
          CARGO_MACHETE_SHA256: d8e3968ed6cbff33c65889434721a9f99972d345aad673890f42d48f62c380ce
        run: |
          set -euo pipefail
          name="cargo-machete-${CARGO_MACHETE_TAG}-x86_64-unknown-linux-musl"
          url="https://github.com/bnjbvr/cargo-machete/releases/download/${CARGO_MACHETE_TAG}/${name}.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 6 --retry-all-errors -o "${RUNNER_TEMP}/${name}.tar.gz.sha256" "${url}.sha256"
          echo "${CARGO_MACHETE_SHA256}  ${RUNNER_TEMP}/${name}.tar.gz.sha256" | sha256sum --check --strict
          digest="$(cat "${RUNNER_TEMP}/${name}.tar.gz.sha256")"
          if [[ ! "${digest}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "${name}.tar.gz.sha256 does not hold a SHA-256." >&2
            exit 1
          fi
          curl -fsSL --proto '=https' --tlsv1.2 --retry 6 --retry-all-errors -o "${RUNNER_TEMP}/${name}.tar.gz" "${url}"
          echo "${digest}  ${RUNNER_TEMP}/${name}.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${name}.tar.gz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/${name}" >> "${GITHUB_PATH}"
      # Every manifest under the repository, the fuzz harness's included.
      - name: Check for unused dependencies
        run: cargo machete

  # Spelling in British English everywhere, the code and the workflows included; _typos.toml
  # says what is not this project's to spell.
  typos:
    name: typos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # Reads the files it checks.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check spelling
        uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461 # v1.50.3

  # No em dash anywhere. The ONNX Runtime notices are Microsoft's text, shipped in every archive
  # byte for byte, and are the one file that may carry one.
  dashes:
    name: dashes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # Reads the files it checks.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The dash is built from its UTF-8 bytes, so this file holds none for the search to find and
      # the pattern does not depend on the runner's locale. Two files are kept byte for byte as
      # others wrote them: ONNX Runtime's notices, and a release's provenance as GitHub serves it,
      # whose signed transparency log checkpoint has one.
      - name: Check for em dashes
        run: |
          set -euo pipefail
          em="$(printf '\342\200\224')"
          if git grep -n -I -F -e "${em}" -- . ':(exclude)third-party/onnxruntime/ThirdPartyNotices.txt' \
            ':(exclude)crates/steamgauge-core/src/self_update/provenance-0.1.3.json'; then
            echo "::error::Em dashes are not used here; use a colon, semicolon, comma, full stop or brackets."
            exit 1
          fi

  # Markdown as .markdownlint-cli2.jsonc holds it: prose at 100 columns, like the code.
  markdown:
    name: markdown
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # Reads the Markdown it lints.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0

  # Every shell script in the repository, with every optional check on. actionlint reads the
  # shell inside the workflows' run: blocks, and nothing reads the scripts beside them.
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # Reads the scripts it checks.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A pinned release rather than the image's own, whose version moves with the image and
      # whose optional checks move with it.
      - name: Install shellcheck
        env:
          # renovate: datasource=github-release-attachments depName=koalaman/shellcheck versioning=regex:^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
          SHELLCHECK_TAG: v0.11.0
          SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
        run: |
          set -euo pipefail
          name="shellcheck-${SHELLCHECK_TAG}"
          archive="${RUNNER_TEMP}/${name}.linux.x86_64.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 6 --retry-all-errors -o "${archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_TAG}/${name}.linux.x86_64.tar.gz"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" "${name}/shellcheck"
          echo "${RUNNER_TEMP}/${name}" >> "${GITHUB_PATH}"
      - name: Check the scripts
        run: |
          set -euo pipefail
          git ls-files -z '*.sh' | xargs -0 --no-run-if-empty shellcheck --enable=all
