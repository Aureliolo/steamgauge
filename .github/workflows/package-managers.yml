name: package managers

# The Homebrew cask, the Scoop manifest and the winget manifests, installed the way a person
# installs them, on the system each is for, and the program they installed run. On a pull request
# that touches them, what the branch's script writes for the latest release, from that release's
# signed checksums, after the committed files are checked against what the release's own script
# wrote; until a release exists there is nothing to install, and the jobs skip. Called by the
# release, the files it wrote for itself, before any of them goes further.
on:
  pull_request:
    paths:
      - Casks/**
      - bucket/**
      - tools/release/package-managers.sh
      - .github/workflows/package-managers.yml
      - .github/workflows/release.yml
      - .github/workflows/release-build.yml
  workflow_call:
    inputs:
      files:
        description: The uploaded files holding Casks/, bucket/ and winget/, installed in place of the committed ones
        type: string
        required: true
      tag:
        description: The release whose attached steamgauge.json Scoop also installs from, by its address
        type: string
        required: true

permissions: {}

# Its own group: called by the release, `github.workflow` is the release's name, and a group
# matching the release's own would hold this run behind the run that called it.
concurrency:
  group: package-managers-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Scoop's own code, pinned by commit; its installer always fetches the tip of master, so it is
  # not used. The pin is raised by Renovate from the tag.
  # renovate: datasource=github-tags depName=ScoopInstaller/Scoop
  SCOOP_TAG: v0.5.3
  SCOOP_COMMIT: b588a06e41d920d2123ec70aee682bae14935939

jobs:
  # A pull request can change the committed files by hand; what reaches people has to be exactly
  # what the release's own signed checksums say, written by the script as it was at that release's
  # tag. What is installed is what this branch's script writes, so a change to the script is
  # proven before a release depends on it.
  signed:
    name: package managers (signed)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # Reads the files, and the public release they name.
    outputs:
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the files are what the release they name is signed over
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -f bucket/steamgauge.json ]]; then
            version="$(jq -r .version bucket/steamgauge.json)"
          else
            tag="$(gh release list --repo "${GITHUB_REPOSITORY}" --exclude-drafts --exclude-pre-releases \
              --limit 1 --json tagName --jq '.[0].tagName // empty')"
            if [[ -z "${tag}" ]]; then
              echo "No release exists yet; nothing to install."
              exit 0
            fi
            version="${tag#v}"
          fi
          tag="v${version}"
          mkdir release released written
          gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" --dir release \
            --pattern SHA256SUMS --pattern "steamgauge-${version}.intoto.jsonl"
          gh attestation verify release/SHA256SUMS --bundle "release/steamgauge-${version}.intoto.jsonl" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-build.yml" \
            --source-ref "refs/tags/${tag}" --deny-self-hosted-runners
          if [[ -f bucket/steamgauge.json || -f Casks/steamgauge.rb ]]; then
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/${GITHUB_REPOSITORY}/contents/tools/release/package-managers.sh?ref=${tag}" > "${RUNNER_TEMP}/package-managers.sh"
            bash "${RUNNER_TEMP}/package-managers.sh" "${version}" release/SHA256SUMS released
            diff -u released/Casks/steamgauge.rb Casks/steamgauge.rb
            diff -u released/bucket/steamgauge.json bucket/steamgauge.json
          fi
          bash tools/release/package-managers.sh "${version}" release/SHA256SUMS written
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Upload what this branch writes
        if: steps.check.outputs.version != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-managers-signed
          path: |
            written/Casks/steamgauge.rb
            written/bucket/steamgauge.json
            written/winget/*.yaml
          if-no-files-found: error
          retention-days: 1

  # The disk image holds an Apple Silicon app, so the cask is installed on Apple Silicon alone.
  homebrew:
    name: package managers (homebrew)
    needs: signed
    if: ${{ !cancelled() && (inputs.files != '' || needs.signed.outputs.version != '') }}
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read # Reads the cask.
    env:
      # Homebrew as the runner image ships it: it has no version to pin, and an update would
      # change it between runs.
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_ENV_HINTS: 1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Take the files under test
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.files || 'package-managers-signed' }}

      # Homebrew clones a tap, so the cask has to be committed, on a branch the clone checks out;
      # a person's tap is the same repository at its default branch.
      - name: Tap this repository, install from it and run what it installed
        run: |
          set -euo pipefail
          brew --version
          git switch --quiet --create package-managers-check
          git add Casks/steamgauge.rb
          git -c user.name=package-managers -c user.email=package-managers@localhost commit --quiet \
            --allow-empty --message 'The cask under test'
          version="$(jq -r .version bucket/steamgauge.json)"
          brew tap aureliolo/steamgauge "${GITHUB_WORKSPACE}"
          brew install --cask aureliolo/steamgauge/steamgauge
          app=/Applications/SteamGauge.app
          test -x "${app}/Contents/MacOS/steamgauge"
          said="$(steamgauge --version)"
          if [[ "${said}" != "steamgauge ${version}" ]]; then
            echo "steamgauge --version said '${said}', not 'steamgauge ${version}'." >&2
            exit 1
          fi
          echo "${said}"
          # Up for a while and not exited is as much as a machine with no one at it can tell.
          "${app}/Contents/MacOS/steamgauge" &
          pid=$!
          sleep 20
          if ! kill -0 "${pid}" 2> /dev/null; then
            wait "${pid}" || true
            echo "The window exited within 20 seconds of starting." >&2
            exit 1
          fi
          kill "${pid}" 2> /dev/null || true
          wait "${pid}" 2> /dev/null || true
          echo "The window stayed up."
          brew audit --cask --strict aureliolo/steamgauge/steamgauge
          brew uninstall --cask aureliolo/steamgauge/steamgauge
          if [[ -e "${app}" ]] || command -v steamgauge > /dev/null; then
            echo "Uninstalling left SteamGauge behind." >&2
            exit 1
          fi
          brew untap aureliolo/steamgauge

  scoop:
    name: package managers (scoop)
    needs: signed
    if: ${{ !cancelled() && (inputs.files != '' || needs.signed.outputs.version != '') }}
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read # Reads the manifest.
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Take the files under test
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.files || 'package-managers-signed' }}

      - name: Install Scoop at its pinned commit
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $core = "$env:RUNNER_TEMP\scoop\apps\scoop\current"
          git init --quiet $core
          git -C $core fetch --quiet --depth 1 https://github.com/ScoopInstaller/Scoop.git $env:SCOOP_COMMIT
          git -C $core checkout --quiet FETCH_HEAD
          if ((git -C $core rev-parse HEAD) -ne $env:SCOOP_COMMIT) { throw 'Scoop is not at its pinned commit.' }
          # The folders Scoop's installer makes that Scoop itself expects to find.
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\scoop\shims", "$env:RUNNER_TEMP\scoop\buckets" | Out-Null

      # By address first, as the README gives it: from the release itself when there is one, the
      # file when there is not. Then as a bucket, this repository added the way a person adds it.
      - name: Install by address, then from this repository as a bucket
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:SCOOP = "$env:RUNNER_TEMP\scoop"
          $scoop = "$env:SCOOP\apps\scoop\current\bin\scoop.ps1"
          $version = (Get-Content bucket/steamgauge.json -Raw | ConvertFrom-Json).version
          # scoop.ps1 is a script, not a program, so a failure shows only in its exit code.
          function Scoop {
            & $scoop @args
            if ($LASTEXITCODE -ne 0) { throw "scoop $args failed with $LASTEXITCODE." }
          }
          # The command as a new terminal finds it, on the PATH Scoop left in the registry; the
          # window from the folder the Start menu shortcut points into.
          function Check {
            $installed = "$env:SCOOP\apps\steamgauge\current"
            $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'User') + ';' + [Environment]::GetEnvironmentVariable('PATH', 'Machine')
            $found = (Get-Command steamgauge -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
            if ($found -ne "$installed\steamgauge.exe") { throw "steamgauge on the PATH is $found, not $installed\steamgauge.exe." }
            # PowerShell hands a windowed program a pipe, and waits for it, only when something
            # further down the pipeline reads it; an assignment alone does not count.
            $said = (& steamgauge --version | Out-String).Trim()
            if ($said -ne "steamgauge $version") { throw "steamgauge --version said '$said', not 'steamgauge $version'." }
            Write-Output $said
            foreach ($file in 'steamgauge.exe', 'DirectML.dll', 'LICENSE', 'THIRD-PARTY-NOTICES.txt') {
              if (-not (Test-Path "$installed\$file")) { throw "Scoop put no $file in $installed." }
            }
            $shortcut = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Scoop Apps\SteamGauge.lnk"
            if (-not (Test-Path $shortcut)) { throw "Scoop made no Start menu shortcut at $shortcut." }
            $window = Start-Process -FilePath "$installed\steamgauge.exe" -PassThru
            Start-Sleep -Seconds 20
            if ($window.HasExited) { throw "The window exited within 20 seconds of starting, with $($window.ExitCode)." }
            Stop-Process -Id $window.Id -Force
            $window.WaitForExit()
            Write-Output 'The window stayed up.'
          }

          $address = if ($env:TAG) {
            "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/steamgauge.json"
          } else {
            (Resolve-Path bucket/steamgauge.json).Path
          }
          Scoop install --no-update-scoop $address
          Check
          Scoop uninstall steamgauge

          git switch --quiet --create package-managers-check
          git add bucket/steamgauge.json
          git -c user.name=package-managers -c user.email=package-managers@localhost commit --quiet `
            --allow-empty --message 'The manifest under test'
          # Scoop takes a bucket only by a Git URL, which a plain path is not.
          Scoop bucket add aureliolo ("file:///" + ($env:GITHUB_WORKSPACE -replace '\\', '/'))
          Scoop install --no-update-scoop aureliolo/steamgauge
          Check
          Scoop uninstall steamgauge
          if (Test-Path "$env:SCOOP\apps\steamgauge") { throw 'Uninstalling left SteamGauge behind.' }
          if ([Environment]::GetEnvironmentVariable('PATH', 'User') -like '*apps\steamgauge*') { throw 'Uninstalling left SteamGauge on the PATH.' }

  # winget's own checks of the manifests, then winget installing the setup program they name,
  # per user and silently, as `winget install` does for a person.
  winget:
    name: package managers (winget)
    needs: signed
    if: ${{ !cancelled() && (inputs.files != '' || needs.signed.outputs.version != '') }}
    runs-on: windows-2025
    timeout-minutes: 20
    # It downloads only this run's own files and public releases, which takes no token.
    permissions: {}
    defaults:
      run:
        shell: pwsh
    env:
      # The runner image's winget lags the manifest schema winget-pkgs takes and warns over every
      # header, so the manifests are checked by a current one: the program and the packages it
      # runs on, both from its release.
      # renovate: datasource=github-release-attachments depName=microsoft/winget-cli versioning=regex:^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
      WINGET_TAG: v1.29.380
      WINGET_SHA256: 65dea9c01ce08ee7b763366b27c0e651f97db857c11ca9b9c301826c10092f2e
      # renovate: datasource=github-release-attachments depName=microsoft/winget-cli versioning=regex:^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
      WINGET_DEPENDENCIES_TAG: v1.29.380
      WINGET_DEPENDENCIES_SHA256: ba875afe9d190f61218985ac0292a99d1db710bf93e13c68944ca9d89f0d82d1

    steps:
      - name: Take the files under test
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.files || 'package-managers-signed' }}

      - name: Install winget at its pinned release
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $dir = "$env:RUNNER_TEMP\winget-cli"
          New-Item -ItemType Directory -Force $dir | Out-Null
          function Fetch($tag, $name, $sha256) {
            $file = "$dir\$name"
            Invoke-WebRequest "https://github.com/microsoft/winget-cli/releases/download/$tag/$name" -OutFile $file
            if ((Get-FileHash -Algorithm SHA256 $file).Hash -ne $sha256) { throw "$name is not the file pinned." }
            $file
          }
          $bundle = Fetch $env:WINGET_TAG Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle $env:WINGET_SHA256
          $zip = Fetch $env:WINGET_DEPENDENCIES_TAG DesktopAppInstaller_Dependencies.zip $env:WINGET_DEPENDENCIES_SHA256
          Expand-Archive $zip "$dir\dependencies"
          Add-AppxPackage -Path $bundle -DependencyPath (Get-ChildItem "$dir\dependencies\x64\*.appx").FullName -ForceApplicationShutdown
          $said = winget --version
          if ($said -ne $env:WINGET_TAG) { throw "winget --version said $said, not $env:WINGET_TAG." }
          Write-Output $said

      - name: Validate, install, run and uninstall
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version =(Get-Content bucket/steamgauge.json -Raw | ConvertFrom-Json).version
          winget validate --manifest winget --disable-interactivity
          # A manifest from a folder rather than from a source is refused until this is on.
          winget settings --enable LocalManifestFiles
          # winget marks a setup program from its own source as trusted, having scanned it, and one
          # from a manifest on disk as from the internet; Windows then asks whether to run that
          # one, in a window nobody here can answer. This turns the question off for winget alone.
          $env:SEE_MASK_NOZONECHECKS = '1'
          # Bounded, because a setup program that waits on a window nobody can see waits until the
          # job is cancelled, and a cancelled job keeps nothing that says what it was waiting on.
          $log = "$env:RUNNER_TEMP\winget-install.log"
          $install = Start-Process winget -NoNewWindow -PassThru -ArgumentList @(
            'install', '--manifest', 'winget', '--scope', 'user', '--silent', '--disable-interactivity',
            '--accept-package-agreements', '--accept-source-agreements', '--log', $log, '--verbose-logs')
          # ExitCode is read from the handle, which has to be taken while the process is running.
          $null = $install.Handle
          if (-not $install.WaitForExit(240000)) {
            # Every window on the desktop with the text inside it, which is what was being asked.
            Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
            $any = [System.Windows.Automation.Condition]::TrueCondition
            $root = [System.Windows.Automation.AutomationElement]::RootElement
            foreach ($window in $root.FindAll([System.Windows.Automation.TreeScope]::Children, $any)) {
              $owner = (Get-Process -Id $window.Current.ProcessId -ErrorAction SilentlyContinue).ProcessName
              Write-Output "$owner : $($window.Current.Name)"
              foreach ($part in $window.FindAll([System.Windows.Automation.TreeScope]::Descendants, $any)) {
                if ($part.Current.Name) { Write-Output "    $($part.Current.Name)" }
              }
            }
            Get-CimInstance Win32_Process | Where-Object ParentProcessId -EQ $install.Id |
              Format-Table ProcessId, Name, CommandLine -AutoSize | Out-String -Width 400
            if (Test-Path $log) { Get-Content $log }
            throw 'winget install was still running after four minutes.'
          }
          if ($install.ExitCode -ne 0) {
            Get-Content $log
            throw "winget install failed with $($install.ExitCode)."
          }
          $installed = "$env:LOCALAPPDATA\SteamGauge"
          foreach ($file in 'steamgauge.exe', 'DirectML.dll', 'LICENSE', 'THIRD-PARTY-NOTICES.txt') {
            if (-not (Test-Path "$installed\$file")) { throw "winget's install put no $file in $installed." }
          }
          # PowerShell hands a windowed program a pipe, and waits for it, only when something
          # further down the pipeline reads it; an assignment alone does not count.
          $said = (& "$installed\steamgauge.exe" --version | Out-String).Trim()
          if ($said -ne "steamgauge $version") { throw "steamgauge --version said '$said', not 'steamgauge $version'." }
          Write-Output $said
          $window = Start-Process -FilePath "$installed\steamgauge.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($window.HasExited) { throw "The window exited within 20 seconds of starting, with $($window.ExitCode)." }
          Stop-Process -Id $window.Id -Force
          $window.WaitForExit()
          Write-Output 'The window stayed up.'
          winget uninstall --manifest winget --silent --disable-interactivity --accept-source-agreements
          # NSIS's uninstaller copies itself to %TEMP% and carries on from there, so winget returns
          # before the files are gone.
          $deadline = (Get-Date).AddMinutes(2)
          while ((Test-Path "$installed\steamgauge.exe") -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (Test-Path "$installed\steamgauge.exe") { throw "Uninstalling left $installed\steamgauge.exe behind." }
