name: scorecard

# OpenSSF Scorecard: branch protection, pinned dependencies, token permissions and the rest,
# checked from outside and published so the README's badge is the same answer anyone can fetch.
# A change to a ruleset changes the score, so it runs then too.
on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Uploads the result to code scanning.
      actions: read # Scorecard scores the CI checks from the workflow run history.
      contents: read # Reads the repository it is scoring.
      id-token: write # Signs the published result, so the badge cannot be forged by anything but this workflow.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scorecard
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
