name: winget

# Submits one release to microsoft/winget-pkgs, and only when dispatched by hand on that
# release's tag:
#
#   gh workflow run winget.yml --ref vX.Y.Z                    (writes and checks, submits nothing)
#   gh workflow run winget.yml --ref vX.Y.Z -f submit=true     (then opens the pull request)
#
# The release never does this itself, so a release is not a pull request on someone else's
# repository. tools/release/winget-submit.sh opens it from a fork with a classic token, since
# GitHub lets no fine-grained token open one. The manifests are written again here from the
# published release, because the release run's own files expire.
on:
  workflow_dispatch:
    inputs:
      submit:
        description: Open the pull request on microsoft/winget-pkgs once every check passes
        type: boolean
        default: false

permissions: {}

# One submission per tag at a time, and never cancelled: a second dispatch waits for the first.
concurrency:
  group: winget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The manifests, from the checksums as published, verified against the release's attestation the
  # way a person's download would be.
  write:
    name: write
    if: github.repository == 'Aureliolo/steamgauge'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # Reads the tagged script and the published release.
    outputs:
      version: ${{ steps.write.outputs.version }}

    steps:
      - name: Refuse anything but a release tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "${REF_TYPE}" != tag || ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Dispatch this on a release tag: gh workflow run winget.yml --ref vX.Y.Z" >&2
            exit 1
          fi

      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Write them from the release's signed checksums
        id: write
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bundle="steamgauge-${version}.intoto.jsonl"
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir release \
            --pattern SHA256SUMS --pattern "${bundle}"
          gh attestation verify release/SHA256SUMS --bundle "release/${bundle}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-build.yml" \
            --source-ref "${GITHUB_REF}" --deny-self-hosted-runners
          bash tools/release/package-managers.sh "${version}" release/SHA256SUMS package-managers
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      # The bucket file is kept because the winget test reads the version from it.
      - name: Upload them
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winget-manifests
          path: |
            package-managers/bucket/steamgauge.json
            package-managers/winget/*.yaml
          if-no-files-found: error
          retention-days: 1

  # winget's own checks of the manifests, at the pinned winget release package-managers.yml holds.
  test:
    name: package managers
    needs: write
    permissions:
      contents: read # Reads the tagged workflow and the published release.
    # `./` as for release-build.yml in release.yml.
    uses: ./.github/workflows/package-managers.yml # zizmor: ignore[self-repository]
    with:
      files: winget-manifests
      tag: ${{ github.ref_name }}
      winget_only: true

  # The script ticks the pull request's "validated" box on the strength of the test job.
  submit:
    name: submit
    needs: [write, test]
    if: inputs.submit
    runs-on: windows-2025
    timeout-minutes: 20
    # The token is a secret of this environment, which only release tags can deploy to.
    environment: winget
    permissions:
      contents: read # Reads the published release.
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Refuse to go on without the token
        env:
          TOKEN_SET: ${{ secrets.WINGET_TOKEN != '' }}
        run: |
          if ($env:TOKEN_SET -ne 'true') {
            Write-Output '::error::The secret WINGET_TOKEN in the winget environment is missing. See .github/release-process.md.'
            exit 1
          }

      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the manifests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: winget-manifests
          path: package-managers

      # The hash comes from the signed checksums already. The setup program is fetched too, and
      # checked to be this release's, to be signed and to hash to what the manifest says.
      - name: Check the installer against the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.write.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $bundle = "steamgauge-$env:VERSION.intoto.jsonl"
          $manifest = Get-Content package-managers/winget/Aureliolo.SteamGauge.installer.yaml -Raw
          $installers = [regex]::Matches($manifest, 'InstallerUrl: (?<url>\S+)\s+InstallerSha256: (?<hash>\S+)')
          if ($installers.Count -ne 1) { throw "The installer manifest has $($installers.Count) installers, not 1." }
          gh release download $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --dir release --pattern $bundle
          $url = $installers[0].Groups['url'].Value
          $setup = Split-Path -Leaf $url
          $release = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$setup"
          if ($url -cne $release) { throw "$url is not this release's $setup." }
          gh release download $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --dir release --pattern $setup
          gh attestation verify "release/$setup" --bundle "release/$bundle" `
            --repo $env:GITHUB_REPOSITORY `
            --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/release-build.yml" `
            --source-ref $env:GITHUB_REF --deny-self-hosted-runners
          $hash = (Get-FileHash -Algorithm SHA256 "release/$setup").Hash
          if ($installers[0].Groups['hash'].Value -cne $hash) { throw "$setup hashes to $hash, not what the manifest says." }

      - name: Submit them
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ needs.write.outputs.version }}
        run: bash tools/release/winget-submit.sh "${VERSION}" package-managers/winget
