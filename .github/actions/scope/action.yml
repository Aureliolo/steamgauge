name: Scope
description: >-
  Whether the checks have to run. A pull request that changes no code, only the package
  managers' manifests or only SteamGauge's version (tools/release/scope.mjs), has its builds,
  installs and scans pass at once, CodeQL's apart (codeql.yml says why): main passed them on the
  same code before it was opened. It
  reads the merge commit actions/checkout makes of a pull request, at a depth of two, against its
  first parent, which is the base it merges onto, so what is classified is what merging would
  change. The classifier is the base's, so a pull request cannot rewrite it to pass itself, and
  nothing of the pull request's is run. Anything but a pull request, and a base that has no
  classifier yet or one that cannot answer a question, runs everything that question decides.

outputs:
  code:
    description: "'true' where the checks have to run, 'false' where the change holds no code."
    value: ${{ steps.scope.outputs.code }}
  kind:
    description: code, version or packaging.
    value: ${{ steps.scope.outputs.kind }}
  fuzzed:
    description: >-
      'true' where the change touches what the fuzz targets build from, and always for a base
      whose classifier cannot say, 'false' where it does not.
    value: ${{ steps.scope.outputs.fuzzed }}
  macos:
    description: >-
      'true' where the macOS jobs have to run, and always for a base whose classifier cannot say.
      'false' where the change holds no code, or only what macOS reads as Linux and Windows do.
    value: ${{ steps.scope.outputs.macos }}

runs:
  using: composite
  steps:
    - id: scope
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
      run: |
        set -euo pipefail
        kind=code
        fuzzed=true
        macos=true
        if [[ "${EVENT}" == pull_request ]]; then
          base="$(git rev-parse HEAD^1)"
          classifier="${RUNNER_TEMP}/base-classifier"
          mkdir -p "${classifier}"
          if git archive "${base}" tools/release | tar -x -C "${classifier}" && [[ -f "${classifier}/tools/release/scope.mjs" ]]; then
            kind="$(node "${classifier}/tools/release/scope.mjs" "${base}" HEAD)"
            # A classifier that does not know a question ignores it and prints a kind again.
            answer="$(node "${classifier}/tools/release/scope.mjs" "${base}" HEAD fuzzed)"
            if [[ "${answer}" == true || "${answer}" == false ]]; then
              fuzzed="${answer}"
            fi
            answer="$(node "${classifier}/tools/release/scope.mjs" "${base}" HEAD macos)"
            if [[ "${answer}" == true || "${answer}" == false ]]; then
              macos="${answer}"
            fi
          fi
        fi
        if [[ "${kind}" != code ]]; then
          macos=false
        fi
        echo "This change is ${kind}. It touches what the fuzz targets build from: ${fuzzed}. The macOS jobs run: ${macos}."
        {
          echo "kind=${kind}"
          echo "code=$([[ "${kind}" == code ]] && echo true || echo false)"
          echo "fuzzed=${fuzzed}"
          echo "macos=${macos}"
        } >> "${GITHUB_OUTPUT}"
