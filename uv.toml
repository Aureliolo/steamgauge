# How training/requirements.lock is resolved. uv reads this from the directory the command
# runs in, which is the repository root; the options live here rather than in the lock's
# header because Renovate re-runs that header to move a pin and refuses any option it does
# not know, and it knows none of these.
[pip]
python-version = "3.13"
python-platform = "windows"
# The CUDA build of torch lives on a second index, and uv will not look past the first one
# for a package the first one also carries without being told.
extra-index-url = ["https://download.pytorch.org/whl/cu126"]
index-strategy = "unsafe-best-match"
emit-index-url = true
no-annotate = true
