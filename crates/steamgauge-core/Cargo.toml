[package]
name = "steamgauge-core"
description = "Corpus ingestion, storage and analysis for SteamGauge."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
arrow = "60.0.0"
jieba-rs = "0.11.0"
ndarray = "0.17.2"
ort = { version = "2.0.0-rc.13", features = ["download-binaries", "ndarray"] }
parquet = "60.0.0"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "gzip", "http2"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
# An update is installed only where Sigstore verifies the release's build provenance. The trust
# root comes through TUF over the client this crate makes, so neither crate's own TLS is built.
sigstore-trust-root = { version = "0.14.0", default-features = false, features = ["tuf"] }
sigstore-verify = { version = "0.14.0", default-features = false }
thiserror = "2.0.21"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

# A macOS app bundle and a Linux archive are unpacked from the verified file and moved into
# place with a rename, which on macOS exchanges the two bundles in one step.
[target.'cfg(unix)'.dependencies]
flate2 = "1.1.10"
rustix = { version = "1.1.5", features = ["fs"] }
tar = { version = "0.4.46", default-features = false }

# GPU backends are opt-in at build time so the default binary needs no vendor runtime to
# start. DirectML is the broad one: it reaches NVIDIA, AMD and Intel through DX12, and adds
# tens of megabytes rather than the ~750 MB a bundled CUDA runtime would cost.
[features]
default = []
directml = ["ort/directml"]
coreml = ["ort/coreml"]
cuda = ["ort/cuda"]
webgpu = ["ort/webgpu"]

[lints]
workspace = true
