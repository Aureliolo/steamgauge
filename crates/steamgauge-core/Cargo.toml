[package]
name = "steamgauge-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Corpus ingestion, storage and analysis for SteamGauge."
repository.workspace = true
license.workspace = true
publish.workspace = true

# Its refusal of a snapshot in the library has tests, which an example runs only when asked.
[[example]]
name = "prepare-cost"
test = true

[dependencies]
arrow = "=60.1.0"
csv = "=1.4.0"
jieba-rs = "=0.11.0"
ndarray = "=0.17.2"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["api-31", "ndarray", "std", "tracing"] }
parquet = "=60.1.0"
percent-encoding = "=2.3.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["gzip", "http2", "json", "rustls-no-provider"] }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
rustls = { version = "=0.23.46", default-features = false, features = ["logging", "ring", "std", "tls12"] }
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
# An update is installed only where Sigstore verifies the release's build provenance. The trust
# root comes through TUF over the client this crate makes, so no TLS of Sigstore's own is built;
# its signature checks run on aws-lc.
sigstore-verify = { version = "=0.15.1", default-features = false, features = ["aws-lc-rs", "tuf"], optional = true }
thiserror = "=2.0.21"
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
steamgauge-stand-ins.workspace = true

# A macOS app bundle and a Linux archive are unpacked from the verified file and moved into
# place with a rename, which on macOS exchanges the two bundles in one step.
[target."cfg(unix)".dependencies]
flate2 = { version = "=1.1.10", optional = true }
rustix = { version = "=1.1.6", features = ["fs"], optional = true }
tar = { version = "=0.4.46", default-features = false, optional = true }

[target."cfg(windows)".dependencies]
winreg = "=0.56.0"

[dev-dependencies]
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }

# GPU backends are opt-in at build time so the default binary needs no vendor runtime to
# start. DirectML is the broad one: it reaches NVIDIA, AMD and Intel through DX12, and adds
# tens of megabytes rather than the ~750 MB a bundled CUDA runtime would cost.
[features]
default = ["prebuilt-onnx-runtime", "self-update"]
coreml = ["ort/coreml"]
cuda = ["ort/cuda"]
directml = ["ort/directml"]
# ONNX Runtime as ort's build script downloads it, over OpenSSL on Linux, and copies beside the
# binary. The fuzz harness builds the core without it and loads the runtime at run time instead,
# so its image fetches nothing it never runs.
prebuilt-onnx-runtime = ["ort/copy-dylibs", "ort/download-binaries", "ort/tls-native"]
# The app's own update. The fuzz harness builds the core without it: it fuzzes what reads review
# text, and aws-lc, which Sigstore's verification runs on, does not build under OSS-Fuzz's
# compiler flags.
self-update = ["dep:flate2", "dep:rustix", "dep:sigstore-verify", "dep:tar"]
webgpu = ["ort/webgpu"]

[lints]
workspace = true
