[package]
name = "steamgauge-app"
description = "Desktop application and command-line interface for SteamGauge."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# The details Windows shows for steamgauge.exe under Properties that tauri-build does not set
# from tauri.conf.json: it writes the product, file description, company, copyright and version.
[package.metadata.tauri-winres]
OriginalFilename = "steamgauge.exe"
InternalName = "steamgauge"

[[bin]]
name = "steamgauge"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
steamgauge-core.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-opener = "2.7.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "io-std", "io-util", "net"] }
# Desktop notifications, sent from the core's side so the window gains no permission. Tauri's own
# notification plugin wraps this crate and drops the click on every desktop system.
notify-rust = "4.18.2"
rfd = { version = "0.17.2", default-features = false, features = ["gtk3"] }
fs4 = "1.1.0"
# The folders Tauri names the app's from, found the same way when no window is open.
dirs = "7.0.0"
# The Model Context Protocol server Claude Code and other clients steer the app through, on a
# local socket (a named pipe on Windows) that only this user can reach.
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-streamable-http-server"] }
interprocess = { version = "2.4.5", features = ["tokio"] }
schemars = "1.2.2"
base64 = "0.23.1"
getrandom = "0.4.3"
# The same server over HTTP on 127.0.0.1, for clients that connect no other way: off until it is
# switched on in Settings, and every request carries a token.
hyper = { version = "1.11.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
tokio-util = "0.7.19"
# One app per user, so a client and the person share one library, one work board and one window.
tauri-plugin-single-instance = "2.5.3"

[dev-dependencies]
glob = "0.3.4"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[features]
default = []
# The window's pages served from inside the binary, with no developer tools. Every build that
# ships has it; without it Tauri treats the build as development.
custom-protocol = ["tauri/custom-protocol"]
directml = ["steamgauge-core/directml"]
coreml = ["steamgauge-core/coreml"]
cuda = ["steamgauge-core/cuda"]
webgpu = ["steamgauge-core/webgpu"]

[lints]
workspace = true
