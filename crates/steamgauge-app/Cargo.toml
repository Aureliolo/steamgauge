[package]
name = "steamgauge-app"
description = "Desktop application and command-line interface for SteamGauge."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "steamgauge"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
steamgauge-core.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-opener = "2.7.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
rfd = { version = "0.17.2", default-features = false, features = ["gtk3"] }

[dev-dependencies]
glob = "0.3.4"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[features]
default = []
# The window's pages served from inside the binary, with no developer tools. Every build that
# ships has it; without it Tauri treats the build as development.
custom-protocol = ["tauri/custom-protocol"]
directml = ["steamgauge-core/directml"]
coreml = ["steamgauge-core/coreml"]
cuda = ["steamgauge-core/cuda"]
webgpu = ["steamgauge-core/webgpu"]

[lints]
workspace = true
