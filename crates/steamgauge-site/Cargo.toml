[package]
name = "steamgauge-site"
description = "Builds SteamGauge's documentation site from docs/, the README and the program's own tables."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
pulldown-cmark = { version = "=0.13.4", default-features = false, features = ["html"] }
# Each page's Markdown twin, written back from the same events the HTML is rendered from, so
# both carry the same rewritten links.
pulldown-cmark-to-cmark = "=23.0.0"
serde_json = "=1.0.151"
steamgauge-app = { path = "../steamgauge-app" }

[lints]
workspace = true
