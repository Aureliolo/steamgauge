extends: default

rules:
  # GitHub's workflow, action and issue-form files are single documents, written without `---`.
  document-start: disable
  # `on:` is the key GitHub reads a workflow's triggers from. Values are still held to true/false.
  truthy:
    check-keys: false
  # Action pins carry their version as `@<sha> # v1.2.3`, one space, as Renovate writes them.
  comments:
    min-spaces-from-content: 1
  # The long lines are shell and release-note table rows inside `run:` blocks. Shell has no line
  # limit, and a Markdown table row cannot be broken.
  line-length: disable
  float-values:
    forbid-inf: true
    forbid-nan: true
    forbid-scientific-notation: true
    require-numeral-before-decimal: true
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
    # nfpm reads file modes as YAML 1.1 octal, `mode: 0644`, the form its docs give.
    ignore:
      - tools/release/linux/nfpm.yaml
  anchors:
    forbid-undeclared-aliases: true
    forbid-duplicated-anchors: true
    forbid-unused-anchors: true
  key-ordering: disable
  quoted-strings: disable
