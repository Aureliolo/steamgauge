# The .deb and the .rpm, built by tools/release/linux-packages.sh from the Linux archive's own
# files, so they hold the very program the archive does. nFPM runs in the folder that script lays
# out, which every path below is relative to. ${VERSION} and ${GLIBC} come from that script.
name: steamgauge
arch: amd64
platform: linux
version: ${VERSION}
release: 1
section: utils
priority: optional
maintainer: Aurelio Amoroso <19254254+Aureliolo@users.noreply.github.com>
vendor: Aurelio Amoroso
homepage: https://github.com/Aureliolo/steamgauge
license: Apache-2.0
changelog: changelog.yml
# Debian keeps each line of the long description within 80 columns.
description: |-
  Finds out what players of a game think, from every Steam review
  SteamGauge downloads a game's Steam reviews, reads every claim in them with a
  model on your own machine, and shows what players praise and criticise, with
  the reviews behind every figure.

# The C library at the newest symbol version the program links, and the webview and toolkit the
# window is drawn with, which bring the rest of what it loads. RPM names each by the soname
# itself. Up to 0.1.2 the package was named steam-gauge; these take its place on an upgrade. RPM
# obsoletes every steam-gauge below 0.1.3 and provides it at 0.1.3, a version no steam-gauge ever
# had, so the package never obsoletes what it provides itself.
overrides:
  deb:
    depends:
      - libc6 (>= ${GLIBC})
      - libwebkit2gtk-4.1-0
      - libgtk-3-0
    provides:
      - steam-gauge
    conflicts:
      - steam-gauge
    replaces:
      - steam-gauge
  rpm:
    depends:
      - libc.so.6(GLIBC_${GLIBC})(64bit)
      - libwebkit2gtk-4.1.so.0()(64bit)
      - libgtk-3.so.0()(64bit)
    provides:
      - steam-gauge = 0.1.3
    # nFPM writes an .rpm's replaces as Obsoletes.
    replaces:
      - steam-gauge < 0.1.3

rpm:
  summary: Finds out what players of a game think, from every Steam review
  group: Applications/Text
  compression: zstd

contents:
  - src: steamgauge
    dst: /usr/bin/steamgauge
    file_info:
      mode: 0755
  - src: steamgauge.desktop
    dst: /usr/share/applications/steamgauge.desktop
    file_info:
      mode: 0644
  - src: icons/32x32.png
    dst: /usr/share/icons/hicolor/32x32/apps/steamgauge.png
    file_info:
      mode: 0644
  - src: icons/128x128.png
    dst: /usr/share/icons/hicolor/128x128/apps/steamgauge.png
    file_info:
      mode: 0644
  - src: icons/128x128@2x.png
    dst: /usr/share/icons/hicolor/256x256/apps/steamgauge.png
    file_info:
      mode: 0644
  - src: icons/icon.png
    dst: /usr/share/icons/hicolor/512x512/apps/steamgauge.png
    file_info:
      mode: 0644
  - src: man/steamgauge.1.gz
    dst: /usr/share/man/man1/steamgauge.1.gz
    packager: deb
    file_info:
      mode: 0644
  - src: man/steamgauge.1.gz
    dst: /usr/share/man/man1/steamgauge.1.gz
    packager: rpm
    type: doc
    file_info:
      mode: 0644
  - src: copyright
    dst: /usr/share/doc/steamgauge/copyright
    packager: deb
    file_info:
      mode: 0644
  - src: lintian-overrides
    dst: /usr/share/lintian/overrides/steamgauge
    packager: deb
    file_info:
      mode: 0644
  - src: README.md
    dst: /usr/share/doc/steamgauge/README.md
    packager: deb
    file_info:
      mode: 0644
  - src: README.md
    dst: /usr/share/doc/steamgauge/README.md
    packager: rpm
    type: doc
    file_info:
      mode: 0644
  - src: THIRD-PARTY-NOTICES.txt
    dst: /usr/share/doc/steamgauge/THIRD-PARTY-NOTICES.txt
    packager: deb
    file_info:
      mode: 0644
  - src: THIRD-PARTY-NOTICES.txt
    dst: /usr/share/doc/steamgauge/THIRD-PARTY-NOTICES.txt
    packager: rpm
    type: doc
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/licenses/steamgauge/LICENSE
    packager: rpm
    type: license
    file_info:
      mode: 0644
