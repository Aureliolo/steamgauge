# cargo-deny over the workspace's graph for the three targets a release is built for, with every
# feature and the dev-dependencies, since a build script or a test helper runs on the machine that
# builds the release as surely as the binary runs on the machine that downloads it. CI runs it on
# every pull request; fuzz/deny.toml holds the fuzz harness, which is a workspace of its own.

[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
# An ignore whose advisory has left the graph is removed, not carried.
unused-ignored-advisory = "deny"
# The advisories osv-scanner.toml ignores that reach this graph, whose evidence is written there in
# full. cargo-deny keeps no expiry of its own, so CI's deny job refuses an id here that
# osv-scanner.toml does not list, or lists with an ignoreUntil that has passed: an ignore expires
# in one place and is looked at again everywhere.
ignore = [
  { id = "RUSTSEC-2024-0429", reason = "glib 0.18.5 under Tauri's GTK3 stack, Linux only; nothing reaches the unsound iterator. Evidence and expiry in osv-scanner.toml." },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error 1.0.4 is unmaintained and runs only inside the compiler. Evidence and expiry in osv-scanner.toml." },
  { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 is unmaintained and runs only inside the compiler. Evidence and expiry in osv-scanner.toml." },
]

[licenses]
# What third-party/about.toml accepts for a release archive, and nothing more: a dev-dependency or
# a feature no archive is built with is held to the same list, so that it cannot become part of a
# release without the licence decision CONTRIBUTING.md asks for.
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "0BSD",
]
confidence-threshold = 0.93
# The list mirrors about.toml, whose entries cover the three archives together, so a licence that
# only another target's graph uses is not unused there.
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
# Tauri's tree carries several versions of the windows, objc2 and GTK families at once, none of
# which this workspace chooses; a duplicate is shown in the log rather than refused.
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates reach each other by path, which carries no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
